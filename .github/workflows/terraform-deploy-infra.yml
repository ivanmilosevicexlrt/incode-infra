name: Terraform Version Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - prod
  push:
    branches:
      - prod

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: ${{ github.ref_name }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Terraform Init
        run: terraform init -backend-config=incode-ci.tfbackend --reconfigure

      - name: Terraform Plan
        run: terraform plan -var-file=envs/${{ github.ref_name }}.tfvars -var="aws_profile=" \
              -out plan.out \ 
              -no-color 2>&1 | tee plan.txt
      
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            prod/tfplan
            prod/.terraform.lock.hcl
          retention-days: 1

  apply:
      needs: plan
      runs-on: ubuntu-latest
      environment: ${{ github.ref_name }} # 👈 This environment has required reviewers
      if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
      defaults:
        run:
          working-directory: prod
      env:
        AWS_REGION: us-east-1

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
