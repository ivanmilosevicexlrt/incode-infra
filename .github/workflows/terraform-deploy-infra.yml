name: Terraform Version Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - prod          
  push:
    branches:
      - prod          
jobs:
  check-tf-version:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: ${{ github.ref_name }}  # adjust to match your repo structure
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Configure AWS Profile
        env: 
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }} 
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}      
        run: |
          PROFILE="inc-${{ github.ref_name }}"
          echo "Using AWS profile: $PROFILE"
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID --profile $PROFILE
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY --profile $PROFILE
          aws configure set region us-east-1 --profile $PROFILE    

      - name: Terraform Init
        run: terraform init -backend-config=incode.tfbackend --reconfigure
