name: Terraform

on:
  workflow_dispatch:
  pull_request:
    branches:
      - prod
  push:
    branches:
      - prod

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/prod') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Terraform Init
        run: terraform init -backend-config=incode-ci.tfbackend --reconfigure

      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform plan -var-file=envs/incode.tfvars -no-color 2>&1 | tee plan.txt

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            prod/plan.txt
            prod/.terraform
            prod/.terraform.lock.hcl
          retention-days: 1

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('prod/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... (truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

  infra-apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: prod-apply
    if: (github.event_name == 'push' && github.ref == 'refs/heads/prod') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Terraform Init
        run: terraform init -backend-config=incode-ci.tfbackend --reconfigure

      - name: Terraform Apply Infra (no addons)
        run: |
          terraform apply -auto-approve \
            -var-file=envs/incode.tfvars \
            -target=module.vpc \
            -target=module.eks \
            -target=module.database

  addons-apply: #--addons like ALB, external secrets, etc. are applied in a separate step to speed up iteration on them without waiting for EKS
    needs: infra-apply
    runs-on: ubuntu-latest
    environment: prod-addons
    if: (github.event_name == 'push' && github.ref == 'refs/heads/prod') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Terraform Init
        run: terraform init -backend-config=incode-ci.tfbackend --reconfigure

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name prod-eks \
            --region us-east-1 \
            --kubeconfig /tmp/kubeconfig-prod-eks

      - name: Terraform Apply Addons
        run: |
          terraform apply -auto-approve \
            -var-file=envs/incode.tfvars \
            -target=module.addons

  alb-apply:
    needs: addons-apply
    runs-on: ubuntu-latest
    environment: prod-addons
    if: (github.event_name == 'push' && github.ref == 'refs/heads/prod') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: prod/alb
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Configure kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name prod-eks \
            --region us-east-1 \
            --kubeconfig /tmp/kubeconfig-prod-eks

      - name: Terraform Init (alb)
        run: terraform init -backend-config=incode.tfbackend --reconfigure

      - name: Terraform Apply ALB
        run: |
          terraform apply -auto-approve \
            -var-file=prod.tfvars       